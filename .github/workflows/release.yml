name: Release

# Publishes @feedbakkr/core to the public npm registry, with provenance, when a
# version tag is pushed. The tag must match packages/core/package.json:
#
#   v0.11.0          -> published under the `latest` dist-tag
#   v0.11.0-next.1   -> published under the `next` dist-tag
#
# Auth is npm trusted publishing (OIDC): npmjs.com trusts this repository and
# workflow file, so no npm token is stored. npm 11.5+ (bundled with Node 24) is
# required for the OIDC exchange.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  id-token: write # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    # Requires approval from a required reviewer before publishing (staged release).
    # Configure the environment in repo settings; reviewer protection needs a public repo on GitHub Free.
    environment: npm-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Check the tag matches the package version
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi

      - name: Install
        run: pnpm install --frozen-lockfile

      # Chromium for the builder's browser tests (packages/core/e2e).
      - name: Install Playwright's Chromium
        run: pnpm --filter @feedbakkr/core exec playwright install --with-deps chromium

      - name: Verify
        run: pnpm verify

      - name: Audit (high+)
        run: pnpm audit --audit-level high

      # Logs the tarball's file list as a last check against shipping a stray
      # file, and fails if a workspace: specifier survived packing.
      - name: Pack
        working-directory: packages/core
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP"
          tgz=$(ls "$RUNNER_TEMP"/*.tgz)
          tar -tzf "$tgz"
          if tar -xzOf "$tgz" package/package.json | grep -q '"workspace:'; then
            echo "::error::package.json still contains a workspace: dependency"
            exit 1
          fi

      # Node 24 ships npm 11, which performs the OIDC token exchange. No
      # registry-url / NODE_AUTH_TOKEN: an _authToken line would force npm onto
      # token auth instead of OIDC.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Publish
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) tag=next ;;
            *) tag=latest ;;
          esac
          tgz=$(ls "$RUNNER_TEMP"/*.tgz)
          npm publish "$tgz" --access public --provenance --tag "$tag"
