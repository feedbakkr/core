name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Version comes from `packageManager` in the root package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Chromium for the builder's browser tests (packages/core/e2e).
      - name: Install Playwright's Chromium
        run: pnpm --filter @ai-food-focus/feedbakkr-core exec playwright install --with-deps chromium

      # Biome, build, typecheck, tests (fixtures, differential, round trip),
      # then the package checks: entry boundaries, publint, type resolution.
      - name: Verify
        run: pnpm verify
