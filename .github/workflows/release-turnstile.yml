name: Release Turnstile

# Publishes @ai-food-focus/turnstile to GitHub Packages when a tag
# `turnstile-v<version>` is pushed. The version must match
# packages/turnstile/package.json; a prerelease (turnstile-v0.2.0-next.1)
# goes under the `next` dist-tag. Core is released by release.yml on its own
# `v<version>` tags.

on:
  push:
    tags: ["turnstile-v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Check the tag matches the package version
        run: |
          version=$(node -p "require('./packages/turnstile/package.json').version")
          if [ "turnstile-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify
        working-directory: packages/turnstile
        run: |
          pnpm build
          pnpm typecheck
          pnpm test
          pnpm check:package

      - name: Audit (high+)
        run: pnpm audit --audit-level high

      - name: Pack
        working-directory: packages/turnstile
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP"
          tgz=$(ls "$RUNNER_TEMP"/*.tgz)
          tar -tzf "$tgz"
          if tar -xzOf "$tgz" package/package.json | grep -q '"workspace:'; then
            echo "::error::package.json still contains a workspace: dependency"
            exit 1
          fi

      - name: Publish
        working-directory: packages/turnstile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
          case "$GITHUB_REF_NAME" in
            *-next*|*-rc*|*-beta*|*-alpha*) tag=next ;;
            *) tag=latest ;;
          esac
          pnpm publish --no-git-checks --tag "$tag"
